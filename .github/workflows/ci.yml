name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flashcart
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: flashcart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flashcart"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://flashcart:local-test-only@127.0.0.1:5432/flashcart
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Start local Firestore emulator
        run: |
          bash scripts/start-firestore-emulator.sh > /tmp/firestore.log 2>&1 &
          python - <<'PY'
          import socket, time
          for _ in range(60):
              try:
                  with socket.create_connection(('127.0.0.1', 18080), timeout=1):
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Firestore emulator did not start')
          PY
      - name: Lint and tests including local integrations
        run: |
          ruff check .
          ruff format --check .
          pytest --cov=flashcart --cov-report=term-missing --cov-fail-under=80
      - name: Build and smoke-test container
        run: |
          docker build -t flashcart:ci .
          docker run --detach --name flashcart-smoke --read-only --tmpfs /tmp flashcart:ci
          docker exec -i flashcart-smoke python < scripts/container-smoke.py
      - name: Local service diagnostics and cleanup
        if: always()
        run: |
          cat /tmp/firestore.log || true
          docker logs flashcart-smoke || true
          docker rm --force flashcart-smoke || true
