[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flashcart-backend"
version = "0.1.0"
description = "FlashCart FastAPI backend with recoverable GCP integration boundaries"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "psycopg[binary,pool]>=3.2,<4", "google-cloud-firestore>=2.19,<3",
  "google-cloud-pubsub>=2.27,<3", "google-cloud-storage>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.11,<1", "uv>=0.9,<1"]

[project.scripts]
flashcart-worker = "flashcart.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flashcart = ["web/*.html"]

[tool.setuptools.data-files]
"share/flashcart/sql" = ["sql/001_inventory.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires disposable local PostgreSQL or Firestore emulator"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
